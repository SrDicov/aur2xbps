# Campaña masiva: muestreo reproducible del AUR → build dual (nix + xbps-src)
# en shards paralelos. El motor nix corre en Ubuntu; el motor xbps-src corre
# en un contenedor Void nativo (los tools del masterdir no arrancan sobre
# la glibc vieja del runner). Cada mitad sube sus resultados y un job final
# fusiona por-motor. Sin secretos: clave RSA efímera por runner.
name: aur2xbps campaign

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed numérica (vacío → run_id como seed)"
        type: string
        required: false
        default: ""
      count:
        description: "Total de paquetes a muestrear"
        type: string
        required: false
        default: "100"
      shards:
        description: "Número de shards paralelos"
        type: string
        required: false
        default: "10"
      engines:
        description: "Motor(es) de build"
        type: choice
        required: false
        default: both
        options: [both, nix, xbps-src]
      timeout_min:
        description: "Minutos por paquete+motor"
        type: string
        required: false
        default: "40"
      only:
        description: "Paquetes concretos separados por espacio (ignora seed/count)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan de campaña
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed-final: ${{ steps.plan.outputs.seed-final }}
      shards-list: ${{ steps.plan.outputs.shards-list }}
      shards-final: ${{ steps.plan.outputs.shards-final }}
      count-final: ${{ steps.plan.outputs.count-final }}
      timeout-final: ${{ steps.plan.outputs.timeout-final }}
    steps:
      - name: Calcular seed y shards
        id: plan
        env:
          SEED_IN: ${{ inputs.seed }}
          SHARDS_IN: ${{ inputs.shards }}
          COUNT_IN: ${{ inputs.count }}
          TIMEOUT_IN: ${{ inputs.timeout_min }}
          ENGINES_IN: ${{ inputs.engines }}
          ONLY_IN: ${{ inputs.only }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$SEED_IN" =~ ^[0-9]+$ ]]; then SEED="$SEED_IN"; else SEED="$RUN_ID"; fi
          if ! ([[ "$SHARDS_IN" =~ ^[0-9]+$ ]] && [ "$SHARDS_IN" -ge 1 ]); then SHARDS_IN=10; fi
          if ! ([[ "$COUNT_IN" =~ ^[0-9]+$ ]] && [ "$COUNT_IN" -ge 1 ]); then COUNT_IN=100; fi
          if ! ([[ "$TIMEOUT_IN" =~ ^[0-9]+$ ]] && [ "$TIMEOUT_IN" -ge 1 ]); then TIMEOUT_IN=40; fi
          LIST="["
          i=0
          while [ "$i" -lt "$SHARDS_IN" ]; do
            if [ "$i" -gt 0 ]; then LIST="$LIST,"; fi
            LIST="${LIST}${i}"
            i=$((i + 1))
          done
          LIST="${LIST}]"
          {
            echo "seed-final=$SEED"
            echo "shards-list=$LIST"
            echo "shards-final=$SHARDS_IN"
            echo "count-final=$COUNT_IN"
            echo "timeout-final=$TIMEOUT_IN"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## aur2xbps campaign · plan"
            echo ""
            echo "| parámetro | valor |"
            echo "|-----------|-------|"
            echo "| seed final | \`$SEED\` |"
            echo "| shards | \`$SHARDS_IN\` |"
            echo "| count | \`$COUNT_IN\` |"
            echo "| engines | \`$ENGINES_IN\` |"
            echo "| timeout_min | \`$TIMEOUT_IN\` |"
            echo "| only | \`${ONLY_IN:-(vacío)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-nix:
    name: Shard ${{ matrix.shard }} · nix
    needs: plan
    if: inputs.engines != 'xbps-src'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards-list) }}
    env:
      AUR2XBPS_ROOT: /tmp/aur2xbps-workspace
      AUR2XBPS_LOGS: /tmp/aur2xbps-logs-nix
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deps + workspace + clave RSA efímera
        run: |
          pip install httpx pyyaml
          mkdir -p "$AUR2XBPS_ROOT/cache" "$AUR2XBPS_ROOT/sources" \
                   "$AUR2XBPS_ROOT/repo" "$AUR2XBPS_ROOT/keys" "$AUR2XBPS_LOGS"
          openssl genrsa -out "$AUR2XBPS_ROOT/keys/privkey.pem" 4096
          chmod 600 "$AUR2XBPS_ROOT/keys/privkey.pem"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Tools xbps para empaquetado (rootfs musl + shims ld-musl)
        run: |
          # Solo para create/rindex/sign del pipeline: el mirror /static está
          # congelado en 0.59, así que se usan los tools actuales del ROOTFS
          # musl vía su propio loader. Los .xbps siguen siendo glibc.
          IDX=https://repo-default.voidlinux.org/live/current/
          FILE=$(curl -sS "$IDX" | grep -oE 'void-x86_64-musl-ROOTFS-[0-9]+\.tar\.xz' | sort -V | tail -1)
          mkdir -p /opt/voidrootfs
          curl -fsSL "$IDX$FILE" | tar -xJ -C /opt/voidrootfs
          test -x /opt/voidrootfs/usr/bin/xbps-create
          LOADER=""
          for c in /opt/voidrootfs/usr/lib/libc.so /opt/voidrootfs/lib/libc.so \
                   /opt/voidrootfs/usr/lib/ld-musl-x86_64.so.1; do
            r=$(readlink -f "$c" 2>/dev/null || true)
            if [ -n "$r" ] && [ -f "$r" ]; then chmod +x "$r"; LOADER="$r"; break; fi
          done
          test -n "$LOADER"
          LIBDIR=$(dirname "$LOADER")
          LIBXBPSDIR=$(dirname "$(find /opt/voidrootfs -name 'libxbps.so.*' | head -1)")
          test -n "$LIBXBPSDIR"
          mkdir -p /opt/xbps-bin
          for b in /opt/voidrootfs/usr/bin/xbps-*; do
            n=$(basename "$b")
            # XBPS_ARCH obligatorio: sin él el tool musl asume x86_64-musl
            # y rechaza los .xbps glibc ("unmatched arch")
            printf '#!/bin/sh\nXBPS_ARCH=x86_64\nexport XBPS_ARCH\nexec %s --library-path %s:%s %s "$@"\n' \
              "$LOADER" "$LIBXBPSDIR" "$LIBDIR" "$b" > "/opt/xbps-bin/$n"
            chmod +x "/opt/xbps-bin/$n"
          done
          /opt/xbps-bin/xbps-create --version
          echo "AUR2XBPS_XBPS_BIN_DIR=/opt/xbps-bin" >> "$GITHUB_ENV"

      - name: Bootstrap masterdir para smoke chroot
        run: |
          # chroot_install necesita un masterdir Void poblado; el smoke corre
          # dentro (glibc nativo) y las ops de repo en host vía shims musl
          export PATH="$AUR2XBPS_XBPS_BIN_DIR:$PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          export AUR2XBPS_VOID_DIR="$(pwd)/common/void-packages"
          export AUR2XBPS_MASTERDIR="$AUR2XBPS_VOID_DIR/masterdir-x86_64"
          mkdir -p "$AUR2XBPS_MASTERDIR"
          cd "$AUR2XBPS_VOID_DIR"
          ./xbps-src -A x86_64 binary-bootstrap
          echo "AUR2XBPS_VOID_DIR=$AUR2XBPS_VOID_DIR" >> "$GITHUB_ENV"
          echo "AUR2XBPS_MASTERDIR=$AUR2XBPS_MASTERDIR" >> "$GITHUB_ENV"

      - name: Validar shard ${{ matrix.shard }} (nix)
        env:
          SEED_FINAL: ${{ needs.plan.outputs.seed-final }}
          COUNT: ${{ needs.plan.outputs.count-final }}
          SHARDS: ${{ needs.plan.outputs.shards-final }}
          TIMEOUT_MIN: ${{ needs.plan.outputs.timeout-final }}
          SHARD: ${{ matrix.shard }}
          ONLY: ${{ inputs.only }}
          ENGINES: nix
        run: |
          OUT_JSON="results-shard-${SHARD}of${SHARDS}.json"
          OUT_MD="results-shard-${SHARD}of${SHARDS}.md"
          if [ -n "$ONLY" ]; then
            ARGS="--only $(printf '%s\n' $ONLY | sort | awk -v s="$SHARD" -v n="$SHARDS" 'NR % n == s + 1' | tr '\n' ' ')"
          else
            ARGS="--count-total $COUNT --seed $SEED_FINAL --shard ${SHARD}/${SHARDS}"
          fi
          # shellcheck disable=SC2086
          set +e
          python3 scripts/mass-validate.py $ARGS \
            --engine nix \
            --timeout $((TIMEOUT_MIN * 60)) \
            --out "$OUT_JSON" \
            > "$AUR2XBPS_LOGS/shard-${SHARD}.stdout.log" \
            2> "$AUR2XBPS_LOGS/shard-${SHARD}.stderr.log"
          RC=$?
          set -e
          echo "mass-validate rc=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::crash global en shard ${SHARD} (rc=${RC})"
            tail -40 "$AUR2XBPS_LOGS/shard-${SHARD}.stderr.log" || true
          fi
          [ -f "$OUT_MD" ] && cat "$OUT_MD" || true
          exit 0

      - name: Preparar staging del shard (nix)
        if: always()
        run: |
          mkdir -p shard-out/logs shard-out/xbps/from-nix
          cp results-shard-*.json results-shard-*.md shard-out/ 2>/dev/null || true
          cp -a "$AUR2XBPS_LOGS"/. shard-out/logs/ 2>/dev/null || true
          find "$AUR2XBPS_ROOT/repo" -name '*.xbps' \
            -exec cp {} shard-out/xbps/from-nix/ \; 2>/dev/null || true
          echo "ficheros en staging: $(find shard-out -type f | wc -l)"

      - name: Subir artefactos del shard (nix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-shard-${{ matrix.shard }}-nix
          path: shard-out
          if-no-files-found: warn

  build-xbps:
    name: Shard ${{ matrix.shard }} · xbps-src
    needs: plan
    if: inputs.engines != 'nix'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards-list) }}
    env:
      AUR2XBPS_ROOT: /tmp/aur2xbps-workspace
      AUR2XBPS_LOGS: /tmp/aur2xbps-logs-xbps
      AUR2XBPS_VOID_DIR: /__w/aur2xbps/aur2xbps/common/void-packages
      AUR2XBPS_MASTERDIR: /__w/aur2xbps/aur2xbps/common/void-packages/masterdir-x86_64
      XBPS_ALLOW_CHROOT_BREAKOUT: "1"
      AUR2XBPS_COPY_BINPKGS: "0"
    steps:
      - name: Git + certificados (requerido por checkout con submodules)
        run: |
          xbps-install -Sy ca-certificates git
          git --version

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deps contenedor Void
        run: |
          xbps-install -Sy python3-pip openssl || xbps-install -Syu python3-pip openssl
          python3 -m pip install --break-system-packages httpx pyyaml || \
            python3 -m pip install httpx pyyaml
          mkdir -p "$AUR2XBPS_ROOT/cache" "$AUR2XBPS_ROOT/sources" \
                   "$AUR2XBPS_ROOT/repo" "$AUR2XBPS_ROOT/keys" "$AUR2XBPS_LOGS"
          openssl genrsa -out "$AUR2XBPS_ROOT/keys/privkey.pem" 4096
          chmod 600 "$AUR2XBPS_ROOT/keys/privkey.pem"
          # NOTA: NO usar /void-packages como ruta — la imagen ya trae ese
          # directorio propio y el enlace caería dentro (xbps-src not found)

      - name: Bootstrap xbps-src (contenedor nativo)
        run: |
          cd "$AUR2XBPS_VOID_DIR"
          ls -la xbps-src || echo "::error::xbps-src ausente"
          head -1 xbps-src 2>/dev/null || true
          command -v bash >/dev/null || { echo "bash ausente: instalando"; xbps-install -Sy bash; }
          ./xbps-src -A x86_64 binary-bootstrap

      - name: Validar shard ${{ matrix.shard }} (xbps-src)
        env:
          SEED_FINAL: ${{ needs.plan.outputs.seed-final }}
          COUNT: ${{ needs.plan.outputs.count-final }}
          SHARDS: ${{ needs.plan.outputs.shards-final }}
          TIMEOUT_MIN: ${{ needs.plan.outputs.timeout-final }}
          SHARD: ${{ matrix.shard }}
          ONLY: ${{ inputs.only }}
        run: |
          OUT_JSON="results-shard-${SHARD}of${SHARDS}.json"
          OUT_MD="results-shard-${SHARD}of${SHARDS}.md"
          if [ -n "$ONLY" ]; then
            ARGS="--only $(printf '%s\n' $ONLY | sort | awk -v s="$SHARD" -v n="$SHARDS" 'NR % n == s + 1' | tr '\n' ' ')"
          else
            ARGS="--count-total $COUNT --seed $SEED_FINAL --shard ${SHARD}/${SHARDS}"
          fi
          cd /__w/aur2xbps/aur2xbps
          # shellcheck disable=SC2086
          set +e
          python3 scripts/mass-validate.py $ARGS \
            --engine xbps-src \
            --timeout $((TIMEOUT_MIN * 60)) \
            --out "$OUT_JSON" \
            > "$AUR2XBPS_LOGS/shard-${SHARD}.stdout.log" \
            2> "$AUR2XBPS_LOGS/shard-${SHARD}.stderr.log"
          RC=$?
          set -e
          echo "mass-validate rc=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::crash global en shard ${SHARD} (rc=${RC})"
            tail -40 "$AUR2XBPS_LOGS/shard-${SHARD}.stderr.log" || true
          fi
          [ -f "$OUT_MD" ] && cat "$OUT_MD" || true
          exit 0

      - name: Preparar staging del shard (xbps-src)
        if: always()
        run: |
          cd /__w/aur2xbps/aur2xbps
          mkdir -p shard-out/logs shard-out/xbps/from-xbps-src
          cp results-shard-*.json results-shard-*.md shard-out/ 2>/dev/null || true
          cp -a "$AUR2XBPS_LOGS"/. shard-out/logs/ 2>/dev/null || true
          find "$AUR2XBPS_VOID_DIR/hostdir/binpkgs" -maxdepth 1 -name '*.xbps' \
            -exec cp {} shard-out/xbps/from-xbps-src/ \; 2>/dev/null || true
          echo "ficheros en staging: $(find shard-out -type f | wc -l)"

      - name: Subir artefactos del shard (xbps-src)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-shard-${{ matrix.shard }}-xbpsrc
          path: shard-out
          if-no-files-found: warn

  report:
    name: Reporte de campaña
    needs: [plan, build-nix, build-xbps]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEED_FINAL: ${{ needs.plan.outputs.seed-final }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bajar artefactos de shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: campaign-shard-*
          merge-multiple: false
          path: artifacts/

      - name: Fusionar resultados
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          results = {}
          for path in sorted(glob.glob("artifacts/*/results-shard-*.json")):
              try:
                  with open(path) as fh:
                      data = json.load(fh)
              except Exception as exc:
                  print(f"aviso: {path} ilegible: {exc}")
                  continue
              if not isinstance(data, dict):
                  continue
              for pkg, entrada in data.items():
                  if pkg == "@blocked":
                      prev = results.setdefault("@blocked", [])
                      if isinstance(entrada, list):
                          for item in entrada:
                              if item not in prev:
                                  prev.append(item)
                      continue
                  if not isinstance(entrada, dict):
                      continue
                  nueva = json.loads(json.dumps(entrada))
                  nueva.setdefault("pkg", pkg)
                  previa = results.get(pkg)
                  if isinstance(previa, dict):
                      previa.setdefault("engines", {}).update(nueva.get("engines", {}))
                      shards = previa.setdefault("shards", [])
                      for s in nueva.get("shards", []):
                          if s not in shards:
                              shards.append(s)
                      previa["ok"] = bool(previa["engines"]) and all(
                          e.get("ok") for e in previa["engines"].values())
                  else:
                      results[pkg] = nueva

          blocked_extra = results.pop("@blocked", [])
          pkgs = {k: v for k, v in results.items() if isinstance(v, dict)}

          ok = sorted(k for k, v in pkgs.items() if v.get("ok"))
          fails = {k: v for k, v in pkgs.items() if not v.get("ok")}
          blocked = [
              k for k, v in fails.items()
              if any(str(e.get("detail", "")).startswith("bloqueado")
                     for e in v.get("engines", {}).values())
          ]
          causes = {}
          for k, v in fails.items():
              if k in blocked:
                  continue
              for eng, e in v.get("engines", {}).items():
                  if not e.get("ok"):
                      c = e.get("detail") or v.get("crash") or "desconocido"
                      causes.setdefault(str(c)[:60], []).append(f"{k} [{eng}]")

          with open("campaign-results.json", "w") as fh:
              json.dump({"packages": pkgs, "blocked": blocked_extra},
                        fh, indent=2, sort_keys=True)

          with open("failed-only.txt", "w") as fh:
              fh.write(" ".join(sorted(k for k in fails if k not in blocked)) + "\n")

          total = len(pkgs)
          rate = 100 * len(ok) / total if total else 0.0
          lines = [
              "# aur2xbps campaign · reporte",
              "",
              f"- Seed final: `{os.environ.get('SEED_FINAL', '?')}`",
              f"- Evaluados: {total} · OK: {len(ok)} · "
              f"Fallo: {len(fails) - len(blocked)} · Bloqueados: {len(blocked) + len(blocked_extra)}",
              f"- Tasa OK (no bloqueados): {rate:.1f}%",
              "",
              "## Causas raíz agrupadas",
              "",
          ]
          if causes:
              lines += ["| causa raíz | × | paquetes |", "|---|---|---|"]
              for c, pks in sorted(causes.items(), key=lambda kv: -len(kv[1])):
                  lines.append(f"| `{c}` | {len(pks)} | {', '.join(pks[:8])} |")
          else:
              lines.append("(sin fallos)")
          report = "\n".join(lines) + "\n"
          with open("campaign-report.md", "w") as fh:
              fh.write(report)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(report)
          print(report)
          PY

      - name: Subir reporte de campaña
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-report
          path: |
            campaign-results.json
            campaign-report.md
            failed-only.txt
          if-no-files-found: warn
