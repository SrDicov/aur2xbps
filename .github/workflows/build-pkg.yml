# Builds bajo demanda: transpila/build/empaqueta paquetes AUR en el runner.
# Sin secretos: clave RSA efímera generada en runtime; workspace en /tmp.
name: aur2xbps build packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Paquetes AUR separados por espacio (ej: paru yay google-chrome)"
        required: true
        type: string
      engine:
        description: "Motor de build"
        type: choice
        default: nix
        options: [nix, xbps-src, auto]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AUR2XBPS_ROOT: /tmp/aur2xbps-workspace
      # la clave se genera en $AUR2XBPS_ROOT/keys: alinear la config o el
      # runner firmaría "sin privkey" (repo local sin firma → rechazado)
      AUR2XBPS_KEYS_DIR: /tmp/aur2xbps-workspace/keys
      CHROOT_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deps + workspace + clave RSA efímera
        run: |
          pip install httpx pyyaml
          mkdir -p "$AUR2XBPS_ROOT/cache" "$AUR2XBPS_ROOT/sources" \
                   "$AUR2XBPS_ROOT/repo" "$AUR2XBPS_ROOT/keys"
          openssl genrsa -out "$AUR2XBPS_ROOT/keys/privkey.pem" 4096
          chmod 600 "$AUR2XBPS_ROOT/keys/privkey.pem"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: xbps estáticos (mirror oficial de Void)
        run: |
          IDX=https://repo-default.voidlinux.org/static/
          FILE=$(curl -sS "$IDX" | grep -oE 'xbps-static-static-[0-9._]+\.x86_64-musl\.tar\.gz' | sort -V | tail -1)
          echo "descargando $FILE"
          mkdir -p /opt/xbps-static
          curl -fsSL "$IDX$FILE" | tar xz -C /opt/xbps-static
          BIN_DIR=$(dirname "$(find /opt/xbps-static -name xbps-create | head -1)")
          test -x "$BIN_DIR/xbps-rindex"
          echo "AUR2XBPS_XBPS_BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"

      - name: Build paquetes (${{ inputs.engine }})
        env:
          PKGS: ${{ inputs.packages }}
          ENGINE: ${{ inputs.engine }}
        run: |
          FAILED=""
          for pkg in $PKGS; do
            echo "::group::=== $pkg ==="
            if ! python3 -m src.cli build "$pkg" --engine "$ENGINE" \
                 > "/tmp/log-$pkg.json" 2>"/tmp/err-$pkg.log"; then
              echo "::warning::$pkg FALLÓ"
              FAILED="$FAILED $pkg"
              tail -5 "/tmp/err-$pkg.log" || true
            fi
            cat "/tmp/log-$pkg.json" 2>/dev/null | tail -1 || true
            echo "::endgroup::"
          done
          find "$AUR2XBPS_ROOT/repo" -name '*.xbps' -printf '%f %s bytes\n'
          if [ -n "$FAILED" ]; then
            echo "FAILED_PKGS=$FAILED" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Resumen
        if: always()
        env:
          PKGS: ${{ inputs.packages }}
        run: |
          {
            echo "## Paquetes solicitados"
            echo '```'
            echo "$PKGS"
            echo '```'
            echo "## Artefactos (.xbps)"
            find "$AUR2XBPS_ROOT/repo" -name '*.xbps' -printf '%f\n' || echo "(ninguno)"
            [ -n "$FAILED_PKGS" ] && echo ":x: Fallidos:$FAILED_PKGS" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xbps-packages
          path: |
            ${{ env.AUR2XBPS_ROOT }}/repo/**/*.xbps
            /tmp/log-*.json
            /tmp/err-*.log
          if-no-files-found: warn
