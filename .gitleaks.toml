# Configuración gitleaks para aur2xbps
# Los fingerprints en `validpgpkeys` de fixtures .SRCINFO son IDs PGP PÚBLICOS
# de mantainers upstream (dato público por diseño, no secretos).
title = "aur2xbps gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "fingerprints PGP públicos en metadatos AUR y ejemplos de docs"
paths = [
  '''tests/fixtures/srcinfo/.*\.SRCINFO''',
]
# SOLO fingerprints precedidos de `validpgpkeys=` (contexto PGP público).
# El regex hex genérico anterior whitelteaba CUALQUIER cadena ≥16 hex en
# TODO el repo (enmascaraba secretos tipo AWS de 40 hex) → eliminado.
regexes = [
  '''(?i)validpgpkeys\s*=\s*["']?[0-9A-Fa-f]{16,40}''',
]
